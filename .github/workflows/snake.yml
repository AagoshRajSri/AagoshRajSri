# This file must live at: .github/workflows/snake.yml
# in your AagoshRajSri/AagoshRajSri repo (same repo as README.md).
#
# What it does: once a day (and once whenever you push to main), it reads
# your public contribution graph, generates a "snake eating the graph"
# animation as SVG, and commits it to an orphan branch called `output`.
# The README's <picture> tag points at that branch, so the animation
# updates itself automatically — no manual re-uploading, ever.

name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day at midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
